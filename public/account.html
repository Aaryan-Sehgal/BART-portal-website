<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <title>BARTNet | MyAccount</title>
        <link rel="stylesheet" href="./css/main.css">
        <link rel="stylesheet" href="./css/index.css">
        <link rel="icon" type="image/x-icon" href="./images/favicon.png">
    </head>
    <body>
        <nav>
            <a id="nav-home" href="./index.html"><img src="images/site-icon.png" alt="BartNET logo"></a>
            <ul>
                <li><a href="departures.html" class="nav-button">Real-Time Departures</a></li>
                <li><a href="barty.html" class="nav-button">BARTy</a></li>
                <li><a href="about.html" class="nav-button">About</a></li>
                <li><a href="contact.html" class="nav-button">Contact</a></li>
            </ul>
            <a id="nav-account" href="./account.html">
                <img id="profile-image" src="./images/default-profile.webp" alt="profile">
                <span id="profile-text">Account / Sign In</span>
            </a>
        </nav>
    </header>

    <div style="display: flex; height: 100vh;">
        <img src="images/ladywaving.png" alt="Lady Waving" style="width:50%; height:100%; object-fit:cover; display:block;">
    <div style="width:50%; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; padding:40px; margin-top:20px;">
        <h1 style="font-size:36px; margin-top:0;">Welcome Back To BartNET!</h1>

        <div style="margin-top:30px; width:100%;">
            <label for="username" style="font-weight:bold; display:block; margin-bottom:5px;">Email / Username</label>
            <input type="text" id="username" name="username" 
                   style="width: 100%; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:4px;">
                   <label for="password" style="font-weight:bold; display:block; margin:20px 0 5px;">Password</label>
            <input type="password" id="password" name="password"
                   style="width: 100%; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:4px;">
            <button id = "login-btn" style="margin-top:20px; padding:10px 20px; font-size:16px; background:#000; color:#fff; border:none; border-radius:4px; cursor:pointer;">Sign In</button>
            <br></br>
            <a href="signup.html"
            style="display:inline-block; margin-top:20px; padding:10px 20px; font-size:16px; background:#fff; color:#000; border:1px solid #ccc; border-radius:4px; cursor:pointer; text-decoration:none;">
            Create a new account
            </a>
                <a href="barty.html" 
                    style="position:fixed; bottom:20px; right:20px; background:#007bff; color:#fff; padding:12px 20px; 
                    border-radius:25px; text-decoration:none; font-weight:bold; font-family:Arial, sans-serif;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.2);">Chat with BARTy!
                </a>
        </div>
    </div>
</div>
</body>
<script>
  const loginBtn = document.getElementById('login-btn');

  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch('/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('user', JSON.stringify(data.user));
        alert(data.message);
        window.location.href = 'index.html';
      } else {
        alert(data.error);
      }

    } catch (err) {
      console.error(err);
      alert('Something went wrong');
    }
  });
</script>
</html>
