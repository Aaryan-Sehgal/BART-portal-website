<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BARTNet | Create Account</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="icon" type="image/x-icon" href="./images/favicon.png">

    <style>
      .signup-container {
        margin: 40px;
      }

      .signup-container input {
        display: block;
        width: 320px;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 16px;
      }

      .signup-container button {
        width: 320px;
        padding: 12px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
</head>

<body>

    <nav>
        <a id="nav-home" href="./index.html">
            <img src="images/site-icon.png" alt="BartNET logo">
        </a>
        <ul>
            <li><a href="departures.html" class="nav-button">Real-Time Departures</a></li>
            <li><a href="barty.html" class="nav-button">BARTy</a></li>
            <li><a href="about.html" class="nav-button">About</a></li>
            <li><a href="contact.html" class="nav-button">Contact</a></li>
        </ul>
        <a id="nav-account" href="./account.html">
            <img id="profile-image" src="./images/default-profile.webp" alt="profile">
            <span id="profile-text">Account / Sign In</span>
        </a>
    </nav>

    <div class="signup-container">
        <h1>Create Account</h1>

        <input type="text" id="username" placeholder="Username">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirm-password" placeholder="Confirm Password">

        <button id="signup-btn">Create Account</button>
    </div>

    <script>
  const signupBtn = document.getElementById('signup-btn');

  signupBtn.addEventListener('click', async () => {
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (password !== confirmPassword) {
      alert('Passwords do not match');
      return;
    }

    try {
      const response = await fetch('/signup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ username, email, password })
      });

      const data = await response.json();

      if (response.ok) {
        alert('Account created successfully');
        window.location.href = 'account.html';
      } else {
        alert(data.error || 'Signup error');
      }
    } catch (err) {
      console.error(err);
      alert('Something went wrong');
    }
  });
</script>

</body>
</html>
